[package]
name = "numanager-spectra"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# Parquet read/write. Pulls in polars.
store = ["dep:polars", "dep:polars-parquet"]
# Downloading from upstream databases. Implies `store`, since the fetcher writes.
fetch = ["store", "dep:ureq", "dep:serde_json"]

[dependencies]
polars = { version = "0.54", default-features = false, features = [
    "parquet",
    "dtype-u16",
], optional = true }
# Only for `ZstdLevel`, which polars does not re-export.
polars-parquet = { version = "0.54", optional = true }
ureq = { version = "3", optional = true }
serde_json = { version = "1", optional = true }

[[bin]]
name = "fetch-spectra"
path = "src/bin/fetch_spectra.rs"
required-features = ["fetch"]
