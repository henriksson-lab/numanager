[package]
name = "numanager-drivers"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
numanager-core = { path = "../numanager-core" }
# WinUSB provisioning is part of the driver crate on Windows, not an add-on: a
# userspace USB driver there cannot open a device that is not bound to WinUSB,
# so the diagnosis belongs next to the claim that fails. The optional entry
# below exposes the same code off Windows under the `winusb` feature (where it
# compiles against numanager-winusb's `Unsupported` entry points), so the wiring
# can be built and checked from a non-Windows host.
numanager-winusb = { path = "../numanager-winusb", optional = true }
futures-lite = { version = "2", optional = true }
hex = "0.4"
libloading = "0.8.9"
nusb = { version = "0.1", optional = true }
# serde/serde_json are unconditional: the Okolab driver embeds its command
# dictionary as JSON (see okolab.rs), so they are needed with or without the
# os-* transports. This crate deliberately has no SQLite dependency — the
# dictionary is extracted ahead of time by scripts/extract-okolab-db.sh.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", optional = true }
sha2 = "0.10"

# Always present on Windows regardless of features: see the note above.
[target.'cfg(windows)'.dependencies]
numanager-winusb = { path = "../numanager-winusb" }

[features]
default = []
egrabber-sdk = []
os-can = ["numanager-core/os-can"]
os-hid = ["numanager-core/os-hid"]
os-serial = ["numanager-core/os-serial", "dep:serialport"]
os-usb = ["dep:futures-lite", "dep:nusb"]
# Off Windows only: build the WinUSB access module against the non-Windows
# entry points. Redundant on Windows, where the module is always compiled.
winusb = ["dep:numanager-winusb"]
# Expose removal of the WinUSB packages numanager published. Off by default:
# this is a library, and unbinding a node changes which driver owns hardware.
# On Windows `numanager-winusb` is always linked, so this only adds the API.
winusb-uninstall = ["numanager-winusb/uninstall"]
