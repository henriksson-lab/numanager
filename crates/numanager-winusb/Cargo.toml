[package]
name = "numanager-winusb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Windows-only WinUSB provisioning: detect which kernel driver owns a USB device
# node, and (behind an approval gate) bind WinUSB to it so numanager's userspace
# drivers can open it — the job Zadig does by hand. Detection is pure Rust via
# SetupAPI; the install backend is a trimmed, vendored libwdi (added separately).

[dependencies]
numanager-core = { path = "../numanager-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_System_Threading",
] }
