[package]
name = "numanager-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
os-can = []
os-hid = ["dep:hidapi"]
os-serial = ["dep:serialport"]

[dependencies]
hidapi = { version = "2", optional = true }
serialport = { version = "4", optional = true }
