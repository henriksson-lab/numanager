name: Build

# numanager is a driver collection consumed by other applications, so the thing
# CI has to protect is simply: does it still build, everywhere? Windows is the
# reason this exists — it is the platform where nusb's device-level control
# transfers do not exist and where there is no system SQLite, and both of those
# have already reached downstream projects as build failures.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Never let one platform's failure hide another's — the point is knowing
      # which platforms are broken, not just that something is.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # `lfs: true` is required, not a nicety: data/third_party's bitstream
        # store is LFS-tracked and `bundled_firmware` compiles it in. Without
        # the smudge, the checkout holds a ~130-byte pointer, and a build here
        # would embed that pointer — which is exactly what the compile-time
        # assertions in bundled_firmware.rs now refuse to do. Note this covers
        # *this* repository only; it does nothing for consumers that take this
        # crate as a cargo git dependency, because cargo checks those out with
        # libgit2, which never runs LFS filters.
        with:
          lfs: true

      # Proves the LFS objects actually arrived, with a message that names the
      # cause. Without it the next failure is a compile-time assertion whose
      # text is right but whose timing makes it look like a code error.
      - name: Verify third-party data is real (not LFS pointers)
        shell: bash
        run: |
          if grep -rl --include='*' 'https://git-lfs.github.com/spec/v1' data/third_party/ 2>/dev/null | grep -q .; then
            echo "::error::data/third_party contains Git LFS pointers, not file contents."
            echo "The checkout did not fetch LFS objects. Ensure actions/checkout has 'lfs: true'."
            grep -rl 'https://git-lfs.github.com/spec/v1' data/third_party/
            exit 1
          fi
          echo "All third-party blobs are real files."

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # libudev-dev: serialport (os-serial) and hidapi (os-hid) link against
        # it. libfontconfig1-dev: slint, behind the examples' `gui` feature.
        # macOS and Windows need no extra packages.
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Default features: the drivers' protocol logic and fixture paths.
      # --all-targets also builds test code, so a broken test compiles here.
      - name: Build (default features)
        run: cargo build --workspace --all-targets

      # The real device transports. These matter most: the USB/serial/HID code
      # is `#[cfg(feature = ...)]`-gated, so a default build never compiles it
      # and platform-specific breakage hides until someone enables a feature.
      - name: Build (device transports)
        run: cargo build --workspace --features numanager-drivers/os-usb,numanager-drivers/os-serial,numanager-drivers/os-hid

      - name: Build (GUI example)
        run: cargo build --workspace --features numanager-examples/gui

      # The builds above compile test code but never run it, so nothing checked
      # that the bundled third-party blobs are the files they claim to be —
      # sizes and digests against data/third_party/*/manifest.toml, and the
      # packed bitstream store actually resolving to programmable bitstreams.
      # Those are what catch a wrong file that still compiles.
      - name: Test
        run: cargo test --workspace
